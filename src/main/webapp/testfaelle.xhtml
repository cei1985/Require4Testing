<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>

    <title>Require4Testing - Testfälle</title>

    <h:outputStylesheet library="css"
                        name="require4testing.css" />

</h:head>

<h:body>

    <div class="page">

        <!-- Kopfbereich -->

        <header class="header">

            <h1 class="title">
                Require4Testing
            </h1>

            <div class="subtitle">
                Organisation manueller Anwendertests
            </div>

        </header>

        <!-- Navigation -->

        <nav class="navigation">

            <a href="index.html"
               class="nav-link">
                Start
            </a>

            <h:link value="Anforderungen"
                    outcome="anforderungen"
                    styleClass="nav-link" />

            <h:link value="Testfälle"
                    outcome="testfaelle"
                    styleClass="nav-link active" />

            <h:link value="Testläufe"
                    outcome="testlaeufe"
                    styleClass="nav-link" />

            <h:link value="Zuordnung"
                    outcome="zuordnung"
                    styleClass="nav-link" />

            <h:link value="Testergebnisse"
                    outcome="testergebnisse"
                    styleClass="nav-link" />

        </nav>

        <!-- Inhaltsbereich -->

        <main class="content">

            <h2 class="page-heading">
                Testfälle
            </h2>

            <h:form>

                <div class="form-grid">

                    <h:outputLabel
                            for="anforderung"
                            value="Anforderung:"
                            styleClass="form-label" />

                    <h:selectOneMenu
                            id="anforderung"
                            value="#{testfallBean.ausgewaehlteAnforderungsId}"
                            styleClass="form-field">

                        <f:selectItems
                                value="#{testfallBean.anforderungen}"
                                var="anforderung"
                                itemValue="#{anforderung.id}"
                                itemLabel="#{anforderung.titel}" />

                        <f:ajax
                                execute="@this"
                                listener="#{testfallBean.anforderungGewechselt}"
                                render=":testfallTabelle" />

                    </h:selectOneMenu>

                    <h:outputLabel
                            for="titel"
                            value="Titel:"
                            styleClass="form-label" />

                    <h:inputText
                            id="titel"
                            value="#{testfallBean.testfall.titel}"
                            required="true"
                            styleClass="form-field" />

                    <h:outputLabel
                            for="beschreibung"
                            value="Beschreibung:"
                            styleClass="form-label" />

                    <h:inputTextarea
                            id="beschreibung"
                            value="#{testfallBean.testfall.beschreibung}"
                            required="true"
                            rows="6"
                            styleClass="form-field" />

                </div>

                <br />

                <h:messages
                        styleClass="status" />

                <br />

                <h:commandButton
                        value="Testfall speichern"
                        action="#{testfallBean.speichern}"
                        styleClass="button">

                    <f:ajax
                            execute="@form"
                            render="@form :testfallTabelle" />

                </h:commandButton>

            </h:form>

            <br />

            <h2 class="page-heading">
                Testfälle der ausgewählten Anforderung
            </h2>

            <h:panelGroup id="testfallTabelle">

                <h:dataTable
                        value="#{testfallBean.testfaelle}"
                        var="testfall"
                        styleClass="data-table">

                    <h:column>

                        <f:facet name="header">
                            ID
                        </f:facet>

                        <h:outputText
                                value="#{testfall.id}" />

                    </h:column>

                    <h:column>

                        <f:facet name="header">
                            Titel
                        </f:facet>

                        <h:outputText
                                value="#{testfall.titel}" />

                    </h:column>

                    <h:column>

                        <f:facet name="header">
                            Beschreibung
                        </f:facet>

                        <h:outputText
                                value="#{testfall.beschreibung}" />

                    </h:column>

                    <h:column>

                        <f:facet name="header">
                            Anforderung
                        </f:facet>

                        <h:outputText
                                value="#{testfall.anforderung.titel}" />

                    </h:column>

                </h:dataTable>

            </h:panelGroup>

        </main>

    </div>

</h:body>

</html>
