<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>

    <title>Require4Testing - Testergebnisse</title>

    <h:outputStylesheet library="css"
                        name="require4testing.css" />

</h:head>

<h:body>

    <div class="page">

        <!-- Kopfbereich -->

        <header class="header">

            <h1 class="title">
                Require4Testing
            </h1>

            <div class="subtitle">
                Organisation manueller Anwendertests
            </div>

        </header>

        <!-- Navigation -->

        <nav class="navigation">

            <a href="index.html"
               class="nav-link">
                Start
            </a>

            <h:link value="Anforderungen"
                    outcome="anforderungen"
                    styleClass="nav-link" />

            <h:link value="Testfälle"
                    outcome="testfaelle"
                    styleClass="nav-link" />

            <h:link value="Testläufe"
                    outcome="testlaeufe"
                    styleClass="nav-link" />

            <h:link value="Zuordnung"
                    outcome="zuordnung"
                    styleClass="nav-link" />

            <h:link value="Testergebnisse"
                    outcome="testergebnisse"
                    styleClass="nav-link active" />

        </nav>

        <!-- Inhaltsbereich -->

        <main class="content">

            <h2 class="page-heading">
                Testergebnisse erfassen
            </h2>

            <h:form>

                <div class="form-grid">

                    <h:outputLabel
                            for="tester"
                            value="Tester:"
                            styleClass="form-label" />

                    <h:selectOneMenu
                            id="tester"
                            value="#{testerBean.tester.id}"
                            styleClass="form-field">

                        <f:selectItem
                                itemLabel="Tester auswählen"
                                itemValue="#{null}"
                                noSelectionOption="true" />

                        <f:selectItems
                                value="#{testlaufBean.tester}"
                                var="tester"
                                itemValue="#{tester.id}"
                                itemLabel="#{tester.name}" />

                        <f:ajax
                                listener="#{testerBean.ladeTestdurchfuehrungen}"
                                render="durchfuehrungen" />

                    </h:selectOneMenu>

                </div>

                <br />

                <h:messages
                        styleClass="status" />

                <br />

                <h:panelGroup id="durchfuehrungen">

                    <h:dataTable
                            value="#{testerBean.testdurchfuehrungen}"
                            var="durchfuehrung"
                            styleClass="data-table">

                        <h:column>

                            <f:facet name="header">
                                Testlauf
                            </f:facet>

                            <h:outputText
                                    value="#{durchfuehrung.testlauf.bezeichnung}" />

                        </h:column>

                        <h:column>

                            <f:facet name="header">
                                Datum
                            </f:facet>

                            <h:outputText
                                    value="#{durchfuehrung.testlauf.datum}">

                                <f:convertDateTime
                                        type="localDate"
                                        pattern="dd.MM.yyyy" />

                            </h:outputText>

                        </h:column>

                        <h:column>

                            <f:facet name="header">
                                Testfall
                            </f:facet>

                            <h:outputText
                                    value="#{durchfuehrung.testfall.titel}" />

                        </h:column>

                        <h:column>

                            <f:facet name="header">
                                Ergebnis
                            </f:facet>

                            <h:selectOneMenu
                                    value="#{durchfuehrung.ergebnis}"
                                    styleClass="form-field">

                                <f:selectItem
                                        itemValue="OFFEN"
                                        itemLabel="OFFEN" />

                                <f:selectItem
                                        itemValue="BESTANDEN"
                                        itemLabel="BESTANDEN" />

                                <f:selectItem
                                        itemValue="FEHLGESCHLAGEN"
                                        itemLabel="FEHLGESCHLAGEN" />

                            </h:selectOneMenu>

                        </h:column>

                    </h:dataTable>

                    <br />

                    <h:commandButton
                            value="Ergebnisse speichern"
                            action="#{testerBean.ergebnisSpeichern}"
                            styleClass="button" />

                </h:panelGroup>

            </h:form>

        </main>

    </div>

</h:body>

</html>
