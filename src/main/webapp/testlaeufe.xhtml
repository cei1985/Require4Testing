<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:a="jakarta.faces.passthrough">

<h:head>
    <title>Require4Testing - Testläufe</title>
</h:head>

<h:body>

    <h1>Testläufe</h1>

    <h:form>

        <h:panelGrid columns="2">

            <h:outputLabel for="startDatum" value="Startdatum:" />
            <h:inputText id="startDatum"
                         value="#{testlaufBean.startDatum}"
                         required="true"
                         a:type="datetime-local">
                <f:convertDateTime type="localDateTime"
                                   pattern="yyyy-MM-dd'T'HH:mm" />
            </h:inputText>

            <h:outputLabel for="endDatum" value="Enddatum:" />
            <h:inputText id="endDatum"
                         value="#{testlaufBean.endDatum}"
                         required="true"
                         a:type="datetime-local">
                <f:convertDateTime type="localDateTime"
                                   pattern="yyyy-MM-dd'T'HH:mm" />
            </h:inputText>

        </h:panelGrid>

        <br />

        <h:commandButton value="Testlauf speichern"
                         action="#{testlaufBean.speichern}" />

    </h:form>

    <hr />

    <h2>Gespeicherte Testläufe</h2>

    <h:dataTable value="#{testlaufBean.testlaeufe}"
                 var="testlauf"
                 border="1">

        <h:column>
            <f:facet name="header">ID</f:facet>
            <h:outputText value="#{testlauf.id}" />
        </h:column>

        <h:column>
            <f:facet name="header">Startdatum</f:facet>
            <h:outputText value="#{testlauf.startDatum}">
                <f:convertDateTime type="localDateTime"
                                   pattern="dd.MM.yyyy HH:mm" />
            </h:outputText>
        </h:column>

        <h:column>
            <f:facet name="header">Enddatum</f:facet>
            <h:outputText value="#{testlauf.endDatum}">
                <f:convertDateTime type="localDateTime"
                                   pattern="dd.MM.yyyy HH:mm" />
            </h:outputText>
        </h:column>

    </h:dataTable>

</h:body>

</html>
