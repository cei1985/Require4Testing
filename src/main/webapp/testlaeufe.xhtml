<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:a="jakarta.faces.passthrough">

<h:head>
    <title>Require4Testing - Testläufe</title>
</h:head>

<h:body>

    <h1>Testlauf anlegen</h1>

    <h:form>

        <h:panelGrid columns="2">

            <h:outputLabel for="bezeichnung" value="Bezeichnung:" />
            <h:inputText id="bezeichnung"
                         value="#{testlaufBean.testlauf.bezeichnung}"
                         required="true" />

            <h:outputLabel for="datum" value="Datum:" />
            <h:inputText id="datum"
                         value="#{testlaufBean.testlauf.datum}"
                         required="true"
                         a:type="date">
                <f:convertDateTime type="localDate"
                                   pattern="yyyy-MM-dd" />
            </h:inputText>

        </h:panelGrid>

        <br />

        <h:commandButton value="Testlauf speichern"
                         action="#{testlaufBean.speichern}" />

    </h:form>

</h:body>

</html>
