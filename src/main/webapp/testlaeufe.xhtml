<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:a="jakarta.faces.passthrough">

<h:head>
    <title>Require4Testing - Testläufe</title>
</h:head>

<h:body>

    <h1>Testläufe</h1>

    <h:form>

        <h:panelGrid columns="2">

            <h:outputLabel for="bezeichnung" value="Bezeichnung:" />
            <h:inputText id="bezeichnung"
                         value="#{testlaufBean.bezeichnung}"
                         required="true" />

            <h:outputLabel for="datum" value="Datum:" />
            <h:inputText id="datum"
                         value="#{testlaufBean.datum}"
                         required="true"
                         a:type="date">
                <f:convertDateTime type="localDate"
                                   pattern="yyyy-MM-dd" />
            </h:inputText>

        </h:panelGrid>

        <br />

        <h:commandButton value="Testlauf speichern"
                         action="#{testlaufBean.speichern}" />

    </h:form>

    <hr />

    <h2>Gespeicherte Testläufe</h2>

    <h:dataTable value="#{testlaufBean.testlaeufe}"
                 var="testlauf"
                 border="1">

        <h:column>
            <f:facet name="header">ID</f:facet>
            <h:outputText value="#{testlauf.id}" />
        </h:column>

        <h:column>
            <f:facet name="header">Bezeichnung</f:facet>
            <h:outputText value="#{testlauf.bezeichnung}" />
        </h:column>

        <h:column>
            <f:facet name="header">Datum</f:facet>
            <h:outputText value="#{testlauf.datum}">
                <f:convertDateTime type="localDate"
                                   pattern="dd.MM.yyyy" />
            </h:outputText>
        </h:column>

    </h:dataTable>

</h:body>

</html>
