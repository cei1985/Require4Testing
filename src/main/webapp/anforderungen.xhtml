<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>

    <title>Require4Testing - Anforderungen</title>

    <h:outputStylesheet library="css"
                        name="require4testing.css" />

</h:head>

<h:body>

    <div class="page">

        <!-- Kopfbereich -->

        <header class="header">

            <h1 class="title">
                Require4Testing
            </h1>

            <div class="subtitle">
                Organisation manueller Anwendertests
            </div>

        </header>

        <!-- Navigation -->

        <nav class="navigation">

            <a href="index.html"
               class="nav-link">
                Start
            </a>

            <h:link value="Anforderungen"
                    outcome="anforderungen"
                    styleClass="nav-link active" />

            <h:link value="Testfälle"
                    outcome="testfaelle"
                    styleClass="nav-link" />

            <h:link value="Testläufe"
                    outcome="testlaeufe"
                    styleClass="nav-link" />

            <h:link value="Zuordnung"
                    outcome="zuordnung"
                    styleClass="nav-link" />

            <h:link value="Testergebnisse"
                    outcome="testergebnisse"
                    styleClass="nav-link" />

        </nav>

        <!-- Inhaltsbereich -->

        <main class="content">

            <h2 class="page-heading">
                Anforderungen
            </h2>

            <h:form>

                <div class="form-grid">

                    <h:outputLabel
                            for="titel"
                            value="Bezeichnung / Titel:"
                            styleClass="form-label" />

                    <h:inputText
                            id="titel"
                            value="#{anforderungBean.anforderung.titel}"
                            required="true"
                            styleClass="form-field" />

                    <h:outputLabel
                            for="beschreibung"
                            value="Beschreibung:"
                            styleClass="form-label" />

                    <h:inputTextarea
                            id="beschreibung"
                            value="#{anforderungBean.anforderung.beschreibung}"
                            required="true"
                            rows="6"
                            styleClass="form-field" />

                </div>

                <br />

                <h:messages
                        styleClass="status" />

                <br />

                <h:commandButton
                        value="Anforderung speichern"
                        action="#{anforderungBean.speichern}"
                        styleClass="button" />

            </h:form>

            <br />

            <h2 class="page-heading">
                Gespeicherte Anforderungen
            </h2>

            <h:dataTable
                    value="#{anforderungBean.anforderungen}"
                    var="anforderung"
                    styleClass="data-table">

                <h:column>

                    <f:facet name="header">
                        ID
                    </f:facet>

                    <h:outputText
                            value="#{anforderung.id}" />

                </h:column>

                <h:column>

                    <f:facet name="header">
                        Titel
                    </f:facet>

                    <h:outputText
                            value="#{anforderung.titel}" />

                </h:column>

                <h:column>

                    <f:facet name="header">
                        Beschreibung
                    </f:facet>

                    <h:outputText
                            value="#{anforderung.beschreibung}" />

                </h:column>

            </h:dataTable>

        </main>

    </div>

</h:body>

</html>
