<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Require4Testing - Anforderungen</title>
</h:head>

<h:body>

    <h1>Anforderungen</h1>

    <h:form>

        <h:panelGrid columns="2">

            <h:outputLabel for="titel" value="Titel:" />
            <h:inputText id="titel"
                         value="#{anforderungBean.anforderung.titel}"
                         required="true" />

            <h:outputLabel for="beschreibung" value="Beschreibung:" />
            <h:inputTextarea id="beschreibung"
                             value="#{anforderungBean.anforderung.beschreibung}"
                             required="true"
                             rows="5"
                             cols="50" />

        </h:panelGrid>

        <br />

        <h:commandButton value="Anforderung speichern"
                         action="#{anforderungBean.speichern}" />

    </h:form>

    <hr />

    <h2>Gespeicherte Anforderungen</h2>

    <h:dataTable value="#{anforderungBean.anforderungen}"
                 var="anforderung"
                 border="1">

        <h:column>
            <f:facet name="header">ID</f:facet>
            <h:outputText value="#{anforderung.id}" />
        </h:column>

        <h:column>
            <f:facet name="header">Titel</f:facet>
            <h:outputText value="#{anforderung.titel}" />
        </h:column>

        <h:column>
            <f:facet name="header">Beschreibung</f:facet>
            <h:outputText value="#{anforderung.beschreibung}" />
        </h:column>

    </h:dataTable>

</h:body>

</html>
