<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Require4Testing - Zuordnung</title>
</h:head>

<h:body>

    <h1>Testlauf zuordnen</h1>

    <h:form>

        <h:panelGrid columns="2">

            <h:outputLabel for="testlauf"
                           value="Testlauf:" />

            <h:selectOneMenu id="testlauf"
                             value="#{testlaufBean.ausgewaehlterTestlaufId}"
                             required="true">

                <f:selectItem
                        itemLabel="Testlauf auswählen"
                        itemValue="#{null}"
                        noSelectionOption="true" />

                <f:selectItems
                        value="#{testlaufBean.testlaeufe}"
                        var="testlauf"
                        itemValue="#{testlauf.id}"
                        itemLabel="#{testlauf.bezeichnung}" />

            </h:selectOneMenu>

            <h:outputLabel for="tester"
                           value="Tester:" />

            <h:selectOneMenu id="tester"
                             value="#{testlaufBean.ausgewaehlteTesterId}"
                             required="true">

                <f:selectItem
                        itemLabel="Tester auswählen"
                        itemValue="#{null}"
                        noSelectionOption="true" />

                <f:selectItems
                        value="#{testlaufBean.tester}"
                        var="tester"
                        itemValue="#{tester.id}"
                        itemLabel="#{tester.name}" />

            </h:selectOneMenu>

            <h:outputLabel for="testfaelle"
                           value="Testfälle:" />

            <h:selectManyCheckbox
                    id="testfaelle"
                    value="#{testlaufBean.ausgewaehlteTestfallIds}"
                    layout="pageDirection">

                <f:selectItems
                        value="#{testlaufBean.testfaelle}"
                        var="testfall"
                        itemValue="#{testfall.id}"
                        itemLabel="#{testfall.titel}" />

            </h:selectManyCheckbox>

        </h:panelGrid>

        <br />

        <h:commandButton
                value="Zuordnung speichern"
                action="#{testlaufBean.speichern}" />

    </h:form>

</h:body>

</html>
