<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>

    <title>Require4Testing - Zuordnung</title>

    <h:outputStylesheet library="css"
                        name="require4testing.css" />

</h:head>

<h:body>

    <div class="page">

        <!-- Kopfbereich -->

        <header class="header">

            <h1 class="title">
                Require4Testing
            </h1>

            <div class="subtitle">
                Organisation manueller Anwendertests
            </div>

        </header>

        <!-- Navigation -->

        <nav class="navigation">

            <a href="index.html"
               class="nav-link">
                Start
            </a>

            <h:link value="Anforderungen"
                    outcome="anforderungen"
                    styleClass="nav-link" />

            <h:link value="Testfälle"
                    outcome="testfaelle"
                    styleClass="nav-link" />

            <h:link value="Testläufe"
                    outcome="testlaeufe"
                    styleClass="nav-link" />

            <h:link value="Zuordnung"
                    outcome="zuordnung"
                    styleClass="nav-link active" />

            <h:link value="Testergebnisse"
                    outcome="testergebnisse"
                    styleClass="nav-link" />

        </nav>

        <!-- Inhaltsbereich -->

        <main class="content">

            <h2 class="page-heading">
                Testlauf zuordnen
            </h2>

            <h:form>

                <div class="form-grid">

                    <h:outputLabel
                            for="testlauf"
                            value="Testlauf:"
                            styleClass="form-label" />

                    <h:selectOneMenu
                            id="testlauf"
                            value="#{testlaufBean.ausgewaehlterTestlaufId}"
                            required="true"
                            styleClass="form-field">

                        <f:selectItem
                                itemLabel="Testlauf auswählen"
                                itemValue="#{null}"
                                noSelectionOption="true" />

                        <f:selectItems
                                value="#{testlaufBean.testlaeufe}"
                                var="testlauf"
                                itemValue="#{testlauf.id}"
                                itemLabel="#{testlauf.bezeichnung}" />

                    </h:selectOneMenu>

                    <h:outputLabel
                            for="tester"
                            value="Tester:"
                            styleClass="form-label" />

                    <h:selectOneMenu
                            id="tester"
                            value="#{testlaufBean.ausgewaehlteTesterId}"
                            required="true"
                            styleClass="form-field">

                        <f:selectItem
                                itemLabel="Tester auswählen"
                                itemValue="#{null}"
                                noSelectionOption="true" />

                        <f:selectItems
                                value="#{testlaufBean.tester}"
                                var="tester"
                                itemValue="#{tester.id}"
                                itemLabel="#{tester.name}" />

                    </h:selectOneMenu>

                    <h:outputLabel
                            for="testfaelle"
                            value="Testfälle:"
                            styleClass="form-label" />

                    <div class="checkbox-group">

                        <h:selectManyCheckbox
                                id="testfaelle"
                                value="#{testlaufBean.ausgewaehlteTestfallIds}"
                                layout="pageDirection">

                            <f:selectItems
                                    value="#{testlaufBean.testfaelle}"
                                    var="testfall"
                                    itemValue="#{testfall.id}"
                                    itemLabel="#{testfall.titel}" />

                        </h:selectManyCheckbox>

                    </div>

                </div>

                <br />

                <h:messages
                        styleClass="status" />

                <br />

                <h:commandButton
                        value="Zuordnung speichern"
                        action="#{testlaufBean.speichern}"
                        styleClass="button" />

            </h:form>

        </main>

    </div>

</h:body>

</html>
