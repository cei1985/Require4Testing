<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:a="jakarta.faces.passthrough">

<h:head>
    <title>Require4Testing - Testlauf zuordnen</title>
</h:head>

<h:body>

    <h1>Testlauf zuordnen</h1>

    <h:form>

        <h:panelGrid columns="2">

            <h:outputLabel for="bezeichnung" value="Bezeichnung:" />
            <h:inputText id="bezeichnung"
                         value="#{testlaufBean.testlauf.bezeichnung}"
                         required="true" />

            <h:outputLabel for="datum" value="Datum:" />
            <h:inputText id="datum"
                         value="#{testlaufBean.testlauf.datum}"
                         required="true"
                         a:type="date">
                <f:convertDateTime type="localDate"
                                   pattern="yyyy-MM-dd" />
            </h:inputText>

            <h:outputLabel for="tester" value="Tester:" />
            <h:selectOneMenu id="tester"
                             value="#{testlaufBean.ausgewaehlteTesterId}"
                             required="true">

                <f:selectItem itemLabel="Tester auswählen"
                              itemValue="#{null}"
                              noSelectionOption="true" />

                <f:selectItems value="#{testlaufBean.tester}"
                               var="tester"
                               itemValue="#{tester.id}"
                               itemLabel="#{tester.name}" />

            </h:selectOneMenu>

            <h:outputLabel for="testfaelle" value="Testfälle:" />
            <h:selectManyCheckbox id="testfaelle"
                                  value="#{testlaufBean.ausgewaehlteTestfallIds}"
                                  layout="pageDirection">

                <f:selectItems value="#{testlaufBean.testfaelle}"
                               var="testfall"
                               itemValue="#{testfall.id}"
                               itemLabel="#{testfall.titel}" />

            </h:selectManyCheckbox>

        </h:panelGrid>

        <br />

        <h:commandButton value="Testlauf mit Zuordnung speichern"
                         action="#{testlaufBean.speichern}" />

    </h:form>

</h:body>

</html>
